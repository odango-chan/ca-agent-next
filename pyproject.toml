[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-agent-next"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ca_agent_next*"]
