name: SR-003 Plugin Manager regression

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/ca_agent_next/**'
      - 'tests/**'
      - 'examples/echo/**'
      - 'pyproject.toml'
      - 'docs/SR/SR-003-*'
      - '.github/workflows/sr003-plugin-ci.yml'

permissions:
  contents: read

jobs:
  sr003-regression:
    name: Module tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.14'
    env:
      GOWORK: 'off'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Go from Echo module
        uses: actions/setup-go@v5
        with:
          go-version-file: examples/echo/plugin/go.mod
          cache: false
      - name: Install Python package and test requirements
        run: python -m pip install --disable-pip-version-check -e ".[plugins]" "PyYAML>=6.0,<7"
      - name: Build native Go Echo Plugin
        shell: bash
        working-directory: examples/echo/plugin
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -o bin/echo-plugin.exe .
          else
            go build -trimpath -o bin/echo-plugin .
          fi
      - name: SR-003 Plugin manager tests
        run: python -m unittest discover -s tests -p test_plugin.py -v
      - name: SR-002 Host regression
        run: python -m unittest discover -s tests -p test_host.py -v
      - name: SR-001 Review Context regression
        run: python -m unittest discover -s tests -p test_review_context.py -v
      - name: Python compileall
        run: python -m compileall -q src tests
      - name: Capture Go Echo / Plugin evidence
        run: python tests/capture_sr003_evidence.py
