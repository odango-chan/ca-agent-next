name: Python Toolchain Policy Bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: python-toolchain-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap Policy Check
    if: github.event.pull_request.number == 112
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout PR head and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch exact PR base and head commits
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'

      - name: Install policy interpreter
        run: uv python install 3.14.6

      - name: Load bootstrap policy snapshot and baseline manifest
        shell: bash
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/python-toolchain-policy"
          mkdir -p "$policy_dir"
          test "$PR_NUMBER" = "112"
          test "$BASE_REF" = "feature/issue-96-sr-028-uv-toolchain"
          test "$BASE_SHA" = "83d23e8c04b1c05eb304c2a24a3392f6459ed0f1"
          cp scripts/python_toolchain_policy.py "$policy_dir/python_toolchain_policy.py"
          cp .github/python-toolchain-baseline.json "$policy_dir/baseline.json"
          echo "Policy source: fixed bootstrap PR head"

          uv run --no-project --python 3.14.6 python "$policy_dir/python_toolchain_policy.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --baseline-file "$policy_dir/baseline.json"

      - name: Test bootstrap policy positive and negative cases
        run: |
          uv run --no-project --python 3.14.6 python -m unittest discover -s tests -p test_python_toolchain_policy.py -v

  lock-check:
    name: Python Lock Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Detect root Python project
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] || [ -f uv.lock ]; then
            if [ ! -f pyproject.toml ] || [ ! -f uv.lock ]; then
              echo "::error::Python project requires both pyproject.toml and uv.lock"
              exit 1
            fi
            echo "python_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_project=false" >> "$GITHUB_OUTPUT"
            echo "No root Python project in this PR head; lock check not applicable."
          fi

      - name: Set up uv
        if: steps.scope.outputs.python_project == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'

      - name: Verify lock is synchronized
        if: steps.scope.outputs.python_project == 'true'
        run: uv lock --check
