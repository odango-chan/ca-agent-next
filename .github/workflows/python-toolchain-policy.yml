name: Python Toolchain Policy

# PR #112 is the one-time bootstrap: its base is the SR-028 implementation
# branch, which already contains the uv baseline but not this policy snapshot.
# All subsequent PRs execute the policy script and read its manifest from Base,
# so a PR cannot weaken the gate by changing its own policy implementation.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: python-toolchain-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Python Toolchain Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout PR head and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch exact PR base and head commits
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Determine Python scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          python_scope=false
          while IFS= read -r path; do
            case "$path" in
              src/*|tests/*|scripts/*.py|.github/scripts/*.py|pyproject.toml|uv.lock|.python-version|.gitignore|.github/python-toolchain-baseline.json|requirements*.txt|Pipfile*|poetry.lock|conda-lock.yml|conda-lock.yaml|environment.yml|environment.yaml|.github/workflows/review-context.yml|.github/workflows/sr003-plugin-ci.yml|.github/workflows/python-toolchain-policy.yml)
                python_scope=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                if { git show "$BASE_SHA:$path" 2>/dev/null || true; git show "$HEAD_SHA:$path" 2>/dev/null || true; } | grep -Eiq 'uv |python|pyproject|unittest|pytest'; then
                  python_scope=true
                fi
                ;;
            esac
          done < <(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          echo "python_scope=$python_scope" >> "$GITHUB_OUTPUT"
          echo "Python scope: $python_scope"

      - name: Validate current PR Base ref
        if: steps.scope.outputs.python_scope == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_base_sha="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          if [ "$remote_base_sha" != "$BASE_SHA" ]; then
            echo "::error::PR Base SHA is stale: event=$BASE_SHA remote=$remote_base_sha"
            exit 1
          fi

      - name: Set up uv
        if: steps.scope.outputs.python_scope == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'

      - name: Install policy interpreter
        if: steps.scope.outputs.python_scope == 'true'
        run: uv python install 3.14.6

      - name: Load trusted policy snapshot and baseline manifest
        if: steps.scope.outputs.python_scope == 'true'
        shell: bash
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/python-toolchain-policy"
          mkdir -p "$policy_dir"

          if [ "$PR_NUMBER" = "112" ]; then
            test "$BASE_REF" = "feature/issue-96-sr-028-uv-toolchain"
            test "$BASE_SHA" = "83d23e8c04b1c05eb304c2a24a3392f6459ed0f1"
            cp scripts/python_toolchain_policy.py "$policy_dir/python_toolchain_policy.py"
            cp .github/python-toolchain-baseline.json "$policy_dir/baseline.json"
            echo "Policy source: bootstrap PR head"
          else
            git show "$BASE_SHA:scripts/python_toolchain_policy.py" > "$policy_dir/python_toolchain_policy.py"
            git show "$BASE_SHA:.github/python-toolchain-baseline.json" > "$policy_dir/baseline.json"
            echo "Policy source: trusted PR base"
          fi

          uv run --no-project --python 3.14.6 python "$policy_dir/python_toolchain_policy.py" \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --baseline-file "$policy_dir/baseline.json"

      - name: Test policy positive and negative cases
        if: steps.scope.outputs.python_scope == 'true'
        run: |
          uv run --no-project --python 3.14.6 python -m unittest discover -s tests -p test_python_toolchain_policy.py -v
