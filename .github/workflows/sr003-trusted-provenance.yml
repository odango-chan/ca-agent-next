name: SR-003 trusted SHA provenance

# Runs from the base branch, not PR HEAD, with read-only credentials.
# Never execute code from a pull_request_target HEAD.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-provenance:
    name: Trusted SR-003 SHA provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preseed failure artifact
        shell: bash
        run: |
          # RUNNER_TEMP survives checkout clean/reset and pre-verifier failures.
          mkdir -p "$RUNNER_TEMP/sr003"
          printf '{"status":"NOT_RUN","reason":"TRUSTED_CHECK_DID_NOT_EXECUTE"}\n' > "$RUNNER_TEMP/sr003/trusted-provenance.json"
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up fixed uv toolchain for trusted verifier
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
      - name: Verify live PR SHA and immutable Git tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv python install 3.14.6
          uv sync --python 3.14.6 --locked --group dev --extra plugins
          uv run --python 3.14.6 --no-sync --locked --group dev --extra plugins python scripts/verify_sr003_provenance.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --out "$RUNNER_TEMP/sr003/trusted-provenance.json"
      - name: Upload pass or fail-closed provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-sr003-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sr003/trusted-provenance.json
          if-no-files-found: error
          retention-days: 30
