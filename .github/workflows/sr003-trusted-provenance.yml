name: SR-003 trusted SHA provenance

# Runs from the base branch, not PR HEAD, with read-only credentials.
# Never execute code from a pull_request_target HEAD.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-provenance:
    name: Trusted SR-003 SHA provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preseed failure artifact
        shell: bash
        run: |
          mkdir -p artifacts/sr003
          printf '{"status":"NOT_RUN","reason":"TRUSTED_CHECK_DID_NOT_EXECUTE"}\n' > artifacts/sr003/trusted-provenance.json
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify live PR SHA and immutable Git tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify_sr003_provenance.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --out artifacts/sr003/trusted-provenance.json
      - name: Upload pass or fail-closed provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-sr003-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sr003/trusted-provenance.json
          if-no-files-found: error
          retention-days: 30
