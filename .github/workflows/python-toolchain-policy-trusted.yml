name: Python Toolchain Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: python-toolchain-policy-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Python Toolchain Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout trusted default-branch policy snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact PR Base and untrusted Head objects
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          test -n "$BASE_REF"
          test -n "$HEAD_REPO"
          git fetch --no-tags origin "$BASE_SHA" "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            git fetch --no-tags origin "$HEAD_SHA"
          else
            git fetch --no-tags "https://github.com/$HEAD_REPO.git" "$HEAD_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'

      - name: Install policy interpreter
        run: uv python install 3.14.6

      - name: Run trusted Base policy against PR diff
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.14.6 python scripts/python_toolchain_policy.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --baseline-file .github/python-toolchain-baseline.json

      - name: Test trusted Base policy
        run: |
          uv run --no-project --python 3.14.6 python -m unittest discover -s tests -p test_python_toolchain_policy.py -v
